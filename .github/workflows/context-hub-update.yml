name: Update Context Hub

# Runs every Monday at 07:00 UTC — 1 hour after YNOT.NOW cron (06:00 UTC)
# This gives the multi-agent system time to complete before we export.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  update-context-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout YNOT.NOW repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone Context Hub fork
        env:
          GH_TOKEN: ${{ secrets.CONTEXT_HUB_TOKEN }}
        run: |
          git config --global user.name "YNOT.NOW Intelligence"
          git config --global user.email "shiva@ynotnow.com"
          git clone https://x-access-token:${GH_TOKEN}@github.com/heyshivaai/context-hub.git /tmp/context-hub
          cd /tmp/context-hub
          git remote add upstream https://github.com/andrewyng/context-hub.git
          git fetch upstream
          git merge upstream/main --no-edit || true

      - name: Fetch latest findings from YNOT.NOW API
        run: |
          mkdir -p /tmp/ynot-docs

          # Fetch all domains
          echo "Fetching all insurance AI signals..."
          curl -s "https://ynot-now.vercel.app/api/context-hub?weeks=2" \
            -H "Accept: text/markdown" \
            -o /tmp/ynot-docs/insurance-ai-signals.md
          
          # Fetch domain-specific docs
          for domain in life pc regulation climate horizontal; do
            echo "Fetching domain: $domain"
            curl -s "https://ynot-now.vercel.app/api/context-hub?domain=${domain}&weeks=2" \
              -H "Accept: text/markdown" \
              -o /tmp/ynot-docs/insurance-${domain}-signals.md
          done

          # Verify files are non-empty
          for f in /tmp/ynot-docs/*.md; do
            size=$(wc -c < "$f")
            echo "$f: ${size} bytes"
            if [ "$size" -lt 200 ]; then
              echo "WARNING: $f seems too small, may have failed"
            fi
          done

      - name: Update Context Hub content
        run: |
          # Create directory structure in the fork
          mkdir -p /tmp/context-hub/content/ynot/docs/insurance-ai-signals
          mkdir -p /tmp/context-hub/content/ynot/docs/insurance-life-signals
          mkdir -p /tmp/context-hub/content/ynot/docs/insurance-pc-signals
          mkdir -p /tmp/context-hub/content/ynot/docs/insurance-regulation-signals
          mkdir -p /tmp/context-hub/content/ynot/docs/insurance-climate-signals
          mkdir -p /tmp/context-hub/content/ynot/docs/insurance-horizontal-signals

          # Copy fetched docs
          cp /tmp/ynot-docs/insurance-ai-signals.md \
             /tmp/context-hub/content/ynot/docs/insurance-ai-signals/DOC.md
          cp /tmp/ynot-docs/insurance-life-signals.md \
             /tmp/context-hub/content/ynot/docs/insurance-life-signals/DOC.md
          cp /tmp/ynot-docs/insurance-pc-signals.md \
             /tmp/context-hub/content/ynot/docs/insurance-pc-signals/DOC.md
          cp /tmp/ynot-docs/insurance-regulation-signals.md \
             /tmp/context-hub/content/ynot/docs/insurance-regulation-signals/DOC.md
          cp /tmp/ynot-docs/insurance-climate-signals.md \
             /tmp/context-hub/content/ynot/docs/insurance-climate-signals/DOC.md
          cp /tmp/ynot-docs/insurance-horizontal-signals.md \
             /tmp/context-hub/content/ynot/docs/insurance-horizontal-signals/DOC.md

          echo "Content updated successfully"

      - name: Commit and push to fork
        env:
          GH_TOKEN: ${{ secrets.CONTEXT_HUB_TOKEN }}
        run: |
          cd /tmp/context-hub
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit — findings unchanged since last week"
            exit 0
          fi
          
          WEEK=$(date -u +"%Y-W%V")
          BRANCH="ynot-update-${WEEK}"
          
          git checkout -b "${BRANCH}"
          git add content/ynot/
          git commit -m "feat(ynot): weekly insurance AI signals update ${WEEK}

Auto-generated by YNOT.NOW multi-agent intelligence system.
Eight agents · Life, P&C, Regulation, Climate, Horizontal tech.

Source: https://ynot-now.vercel.app
API: https://ynot-now.vercel.app/api/context-hub"
          
          git push origin "${BRANCH}"
          echo "BRANCH=${BRANCH}" >> $GITHUB_ENV

      - name: Create PR to upstream Context Hub
        env:
          GH_TOKEN: ${{ secrets.CONTEXT_HUB_TOKEN }}
        run: |
          cd /tmp/context-hub
          
          # Check if branch was created (skip if no changes)
          if [ -z "${BRANCH}" ]; then
            echo "No branch created — skipping PR"
            exit 0
          fi
          
          WEEK=$(date -u +"%Y-W%V")
          
          gh pr create \
            --repo andrewyng/context-hub \
            --head "heyshivaai:${BRANCH}" \
            --base main \
            --title "feat(ynot): Insurance AI weekly signals ${WEEK}" \
            --body "## What
Weekly update of YNOT.NOW insurance AI signal intelligence for ${WEEK}.

Six domain-specific docs updated:
- \`ynot/docs/insurance-ai-signals\` — all domains combined
- \`ynot/docs/insurance-life-signals\` — Life, Annuities, Retirement
- \`ynot/docs/insurance-pc-signals\` — Property & Casualty
- \`ynot/docs/insurance-regulation-signals\` — Regulatory (NAIC, FCA, EIOPA, EU AI Act)
- \`ynot/docs/insurance-climate-signals\` — Climate risk, ESG, parametric
- \`ynot/docs/insurance-horizontal-signals\` — Foundation models, agentic AI

## Why
YNOT.NOW is the first domain knowledge source (not API docs) in Context Hub — providing weekly machine-readable insurance AI intelligence that any AI agent can consume via \`chub get ynot/insurance-ai-signals\`.

## How it works
Eight specialized agents run every Monday at 06:00 UTC:
- Phase 1: Scout (P&C), Vita (Life), Lex (Regulation), Terra (Climate), Horizon (Horizontal)
- Phase 2: Null (cross-validation), Weave (pattern synthesis), Faro (strategic synthesis)

Each finding includes verdict (SIGNAL/WATCH), signal status (NEW/EMERGING/CONFIRMED/RECURRING), TRL score, confidence %, and source URL.

## Testing
- [ ] Content fetched live from \`https://ynot-now.vercel.app/api/context-hub\`
- [ ] All six DOC.md files have valid YAML frontmatter
- [ ] Content is < 500 lines per file (progressive disclosure)
- [ ] Source links verified by YNOT.NOW URL verification layer

## Notes
Auto-generated weekly. Live endpoint: https://ynot-now.vercel.app/api/context-hub" \
            || echo "PR may already exist for this week"
